<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>Hash Cnet HMS — SDC ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta content="Hash Cnet HMS" name="description" />
  <meta content="" name="author" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Bootstrap 4 + Icons -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>

<body id="body">

  <!-- ==================== APP (DASHBOARD) ==================== -->
  <div class="app" id="app">
    <!-- Sidebar -->
    <div class="left-side-menu sidebar-dark" id="sidebar">
      <div class="brand">
        <div class="brand-logo">SDC</div>
        <div class="brand-text">
          <h5>Hash Cnet HMS</h5>
          <span>ISP Billing Manager</span>
        </div>
      </div>
      <div class="sidebar-content">
        <ul class="metismenu" id="side-menu">
          <li class="menu-title">Menu</li>
          <li>
            <a href="#" class="nav-item active" data-view="dashboard">
              <i class="fas fa-tachometer-alt"></i><span> Dashboard</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="customers">
              <i class="fas fa-users"></i><span> Customers</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="billing">
              <i class="fas fa-file-invoice-dollar"></i><span> Billing</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="plans">
              <i class="fas fa-wifi"></i><span> Plans</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="renewals">
              <i class="fas fa-sync-alt"></i><span> Renewals</span>
            </a>
          </li>
        </ul>
      </div>
      <div class="sidebar-footer">
        <div class="storage-status">
          <span class="dot"></span> Data saved locally
        </div>
      </div>
    </div>

    <!-- Main -->
    <div class="content-page">
      <div class="navbar-custom topbar">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <h4 class="page-title" id="pageTitle">Dashboard</h4>
        <div class="topbar-actions ml-auto">
          <button class="btn btn-primary" id="quickAddBtn"><i class="fas fa-user-plus"></i> New Customer</button>
        </div>
      </div>

      <div class="content">
        <div class="container-fluid">
          <!-- DASHBOARD -->
          <div class="view active" id="view-dashboard">
            <div class="row">
              <div class="col-12">
                <div class="page-title-box">
                  <h4 class="page-title">Dashboard</h4>
                </div>
              </div>
            </div>
            <div class="row stats-grid" id="statsGrid"></div>
            <div class="row">
              <div class="col-lg-6">
                <div class="card">
                  <div class="card-body">
                    <div class="card-header-custom">
                      <h4 class="card-title">Recent Bills</h4>
                      <button class="btn btn-sm btn-outline-primary" data-goto="billing">View all</button>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-centered mb-0" id="recentBillsTable"></table>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="card">
                  <div class="card-body">
                    <div class="card-header-custom">
                      <h4 class="card-title">Upcoming Renewals</h4>
                      <button class="btn btn-sm btn-outline-primary" data-goto="renewals">View all</button>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover mb-0" id="upcomingRenewalsTable"></table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- CUSTOMERS -->
          <div class="view" id="view-customers">
            <div class="row">
              <div class="col-12">
                <div class="page-title-box">
                  <h4 class="page-title">Customers</h4>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <div class="card-header-custom">
                      <h4 class="card-title">All Customers</h4>
                      <div class="card-actions">
                        <input type="text" class="form-control search-input" id="customerSearch" placeholder="Search customers..." />
                        <button class="btn btn-primary" id="addCustomerBtn"><i class="fas fa-user-plus"></i> Add Customer</button>
                      </div>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover mb-0" id="customersTable"></table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- BILLING -->
          <div class="view" id="view-billing">
            <div class="row">
              <div class="col-12">
                <div class="page-title-box">
                  <h4 class="page-title">Billing</h4>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <div class="card-header-custom">
                      <h4 class="card-title">Bills &amp; Payments</h4>
                      <div class="card-actions">
                        <select class="form-control" id="billingStatusFilter">
                          <option value="all">All statuses</option>
                          <option value="paid">Paid</option>
                          <option value="pending">Pending</option>
                          <option value="overdue">Overdue</option>
                        </select>
                        <button class="btn btn-primary" id="generateBillsBtn"><i class="fas fa-file-invoice"></i> Generate Monthly Bills</button>
                      </div>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover mb-0" id="billsTable"></table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- PLANS -->
          <div class="view" id="view-plans">
            <div class="row">
              <div class="col-12">
                <div class="page-title-box">
                  <h4 class="page-title">Plans</h4>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <div class="card-header-custom">
                      <h4 class="card-title">Internet Plans</h4>
                      <button class="btn btn-primary" id="addPlanBtn"><i class="fas fa-plus"></i> Add Plan</button>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover mb-0" id="plansTable"></table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- RENEWALS -->
          <div class="view" id="view-renewals">
            <div class="row">
              <div class="col-12">
                <div class="page-title-box">
                  <h4 class="page-title">Renewals</h4>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <div class="card-header-custom">
                      <h4 class="card-title">Renewals</h4>
                      <div class="card-actions">
                        <select class="form-control" id="renewalFilter">
                          <option value="all">All</option>
                          <option value="upcoming">Upcoming</option>
                          <option value="expired">Expired</option>
                          <option value="active">Active</option>
                        </select>
                      </div>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover mb-0" id="renewalsTable"></table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Title</h5>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
